services:
  db:
    image: postgres:18.6-alpine3.24
    container_name: n8nclone_db_postgres
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER env is not set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD env is not set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB env is not set}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      timeout: 5s
      interval: 5s
      retries: 10

volumes:
  pgdata:
